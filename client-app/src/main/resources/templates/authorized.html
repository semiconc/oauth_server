<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authorized</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px 5px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .logout-btn {
            background-color: #dc3545;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .token-btn {
            background-color: #28a745;
        }
        .token-btn:hover {
            background-color: #218838;
        }
        .passkey-btn {
            background-color: #ffc107;
        }
        .passkey-btn:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>
    <h1>Authorization Successful!</h1>
    <h2>Welcome, <span th:text="${userName}">User</span>!</h2>

    <div>
        <a href="/tokens" class="button token-btn" target="_blank">View Tokens (JSON)</a>
        <a href="http://localhost:9000/home" class="button passkey-btn" target="_blank">Manage Passkeys</a>
        <a href="/" class="button">Back to Home</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="button logout-btn">Logout</button>
        </form>
    </div>

    <h3>Your Details:</h3>
    <ul>
        <li th:each="attr : ${userAttributes}">
            <strong th:text="${attr.key}"></strong>: <span th:text="${attr.value}"></span>
        </li>
    </ul>
</body>
</html>
